<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frappe ERD Viewer</title>
  <link rel="stylesheet" href="/assets/erd/css/erd.css">
</head>
<body>
  <div class="app-layout">

    <!-- Toolbar -->
    <header class="toolbar">
      <div class="toolbar-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <line x1="10" y1="6.5" x2="14" y2="6.5"/>
          <line x1="6.5" y1="10" x2="6.5" y2="14"/>
          <line x1="17.5" y1="10" x2="17.5" y2="14"/>
        </svg>
        <span class="toolbar-title">ERD Viewer</span>
      </div>

      <div class="toolbar-sep"></div>

      <button class="btn btn-icon" id="btn-zoom-out" title="Zoom Out">−</button>
      <span class="zoom-display" id="zoom-display">100%</span>
      <button class="btn btn-icon" id="btn-zoom-in" title="Zoom In">+</button>
      <button class="btn" id="btn-zoom-reset" title="Reset Zoom">1:1</button>
      <button class="btn" id="btn-fit" title="Fit All to Screen">Fit</button>

      <div class="toolbar-sep"></div>

      <button class="btn" id="btn-hidden" title="Toggle hidden fields">Show Hidden</button>
      <button class="btn" id="btn-auto-layout" title="Auto arrange nodes">Auto Layout</button>

      <div class="toolbar-spacer"></div>

      <button class="btn btn-danger" id="btn-clear" title="Remove all nodes">Clear Canvas</button>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <div class="search-row">
          <input type="text" id="search-input" class="search-input" placeholder="Search doctypes…" autocomplete="off" spellcheck="false">
          <select id="filter-select" class="filter-select">
            <option value="all">All</option>
            <option value="child">Child</option>
            <option value="non-child">Non-child</option>
          </select>
        </div>
      </div>

      <div class="sidebar-scroll">
        <div id="modules-list"></div>
      </div>

      <div class="sidebar-footer">
        <span class="selected-count" id="selected-count"></span>
        <button class="btn btn-load" id="btn-load" disabled>Load Selected</button>
      </div>
    </aside>

    <!-- Canvas -->
    <main class="canvas-wrapper" id="canvas">

      <div class="canvas-hint" id="canvas-hint">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="8" height="8" rx="1"/>
          <rect x="14" y="2" width="8" height="8" rx="1"/>
          <rect x="2" y="14" width="8" height="8" rx="1"/>
          <rect x="14" y="14" width="8" height="8" rx="1"/>
          <line x1="10" y1="6" x2="14" y2="6"/>
          <line x1="6" y1="10" x2="6" y2="14"/>
          <line x1="18" y1="10" x2="18" y2="14"/>
          <line x1="10" y1="18" x2="14" y2="18"/>
        </svg>
        <p class="canvas-hint-text">Select doctypes and click <strong>Load Selected</strong></p>
        <p class="canvas-hint-sub">Pan · Scroll to zoom · Drag nodes</p>
      </div>

      <div class="loading-overlay" id="loading" style="display:none">
        <div class="spinner"></div>
        Loading…
      </div>

      <div id="canvas-transform" style="position:absolute;top:0;left:0;transform-origin:0 0;">
        <svg id="edges-layer"
             style="position:absolute;top:0;left:0;width:16000px;height:10000px;pointer-events:none;">
        </svg>
        <div id="nodes-layer" style="position:absolute;top:0;left:0;"></div>
      </div>

    </main>
  </div>

  <script src="/assets/erd/js/erd.js"></script>
</body>
</html>
